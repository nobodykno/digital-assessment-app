services:
  postgres:
    image: postgres:17
    container_name: dam-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mindfire
      POSTGRES_DB: dam_api

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dam-rabbitmq

    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: dam-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: paramjit
      MINIO_ROOT_PASSWORD: MyStrongPassword@123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile

    container_name: dam-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    env_file:
      - .env.development

    ports:
      - "5001:5001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/v1/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: worker/background-processor/Dockerfile

    container_name: dam-worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

    env_file:
      - .env.development

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: dam-web

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "5173:80"

volumes:
  postgres-data:
  minio-data: